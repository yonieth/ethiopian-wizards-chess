<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ንጉስ • Nigus Ethiopian Wizard's Chess</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <style>
    :root {
      --md-bg: #0D0B0A;
      --md-surface: rgba(28, 25, 23, 0.84);
      --md-surface-high: rgba(45, 40, 36, 0.92);
      --md-primary: #F5C542;
      --md-primary-container: rgba(245, 197, 66, 0.20);
      --md-ember: #FF5722;
      --md-on-surface: #F5EFE6;
      --md-on-surface-variant: #C7B9A5;
      --md-outline: rgba(245, 197, 66, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--md-bg);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: var(--md-on-surface);
      overscroll-behavior: none;
      touch-action: none;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* --- ETHIOPIAN ROYAL FAMILY MAIN MENU --- */
    #main-menu {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(16, 13, 11, 0.45) 0%, rgba(10, 8, 7, 0.90) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: opacity 0.4s ease, visibility 0.4s ease;
      padding: 16px;
    }
    #main-menu.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .menu-card {
      position: relative;
      width: min(720px, 95vw);
      max-height: 92vh;
      background: linear-gradient(155deg, rgba(32, 27, 24, 0.95) 0%, rgba(14, 12, 10, 0.98) 100%);
      border: 1.5px solid rgba(245, 197, 66, 0.55);
      border-radius: 26px;
      padding: 24px 30px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.88), inset 0 0 36px rgba(245, 197, 66, 0.10);
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 24px;
      align-items: center;
      overflow: hidden;
    }

    /* Ethiopian Royal Tibeb Top Ribbon */
    .menu-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: repeating-linear-gradient(
        90deg,
        #1B8A3D 0px, #1B8A3D 28px,
        #F5C542 28px, #F5C542 56px,
        #C62828 56px, #C62828 84px,
        #D4AF37 84px, #D4AF37 112px
      );
    }

    .menu-hero {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      border-right: 1px solid rgba(245, 197, 66, 0.22);
      padding-right: 20px;
    }

    .royal-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--md-primary);
      background: rgba(245, 197, 66, 0.14);
      border: 1px solid rgba(245, 197, 66, 0.38);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .nigus-geez {
      font-size: clamp(42px, 6.5vw, 58px);
      font-weight: 900;
      line-height: 1.02;
      background: linear-gradient(180deg, #FFF8E1 0%, #F5C542 50%, #B38314 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 16px rgba(245, 197, 66, 0.35));
    }

    .nigus-eng {
      font-size: clamp(16px, 2.4vw, 22px);
      font-weight: 800;
      letter-spacing: 4.5px;
      color: var(--md-on-surface);
      margin: 2px 0 8px 0;
    }

    .nigus-desc {
      font-size: 12px;
      color: var(--md-on-surface-variant);
      line-height: 1.45;
      margin-bottom: 14px;
    }

    /* Yona Graphics Official Developer Card */
    .yona-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.52);
      border: 1px solid rgba(245, 197, 66, 0.34);
      border-radius: 16px;
      padding: 8px 14px;
      width: 100%;
    }

    .yona-logo {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 14px rgba(245, 197, 66, 0.22);
    }

    .yona-info {
      display: flex;
      flex-direction: column;
    }

    .yona-sub {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      color: var(--md-on-surface-variant);
    }

    .yona-title {
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 0.6px;
      color: var(--md-primary);
    }

    .menu-controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .m-btn {
      appearance: none;
      width: 100%;
      border: 1px solid rgba(245, 197, 66, 0.32);
      background: rgba(255, 255, 255, 0.05);
      color: var(--md-on-surface);
      padding: 11px 16px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
    }

    .m-btn.gold {
      background: linear-gradient(135deg, #F5C542 0%, #B8860B 100%);
      color: #0D0B0A;
      border-color: #FFF3C4;
      font-size: 14px;
      box-shadow: 0 6px 22px rgba(245, 197, 66, 0.35);
    }

    .m-btn:active {
      transform: scale(0.98);
    }

    .m-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    /* --- SINGLE-LEVEL MATERIAL DESIGN 3 HUD --- */
    .hud-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px 16px;
    }

    .top-bar, .bottom-bar {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--md-surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--md-outline);
      border-radius: 999px;
      padding: 6px 14px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.55);
      margin: 0 auto;
      max-width: 96vw;
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-right: 10px;
      border-right: 1px solid rgba(255, 255, 255, 0.12);
    }

    .brand-title {
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--md-primary);
      white-space: nowrap;
    }

    .turn-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .turn-swatch {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #FFF8E7;
      box-shadow: 0 0 8px #F5C542;
      transition: all 0.3s ease;
    }

    .turn-swatch.black {
      background: #1A1615;
      border: 1.5px solid var(--md-ember);
      box-shadow: 0 0 10px var(--md-ember);
    }

    .captured-tray {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      padding-left: 6px;
      color: var(--md-on-surface-variant);
    }

    .cap-group {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .cap-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .cap-dot.marble { background: #F5C542; }
    .cap-dot.obsidian { background: #FF5722; }

    .md-chip {
      appearance: none;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.06);
      color: var(--md-on-surface);
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .md-chip:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .md-chip.active {
      background: var(--md-primary-container);
      color: var(--md-primary);
      border-color: rgba(245, 197, 66, 0.45);
    }

    .divider {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.12);
    }

    #status-banner {
      position: fixed;
      top: 64px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: var(--md-surface-high);
      border: 1px solid var(--md-primary);
      color: var(--md-primary);
      padding: 7px 18px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 20;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
      white-space: nowrap;
    }

    #status-banner.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 650px) and (orientation: portrait) {
      .menu-card { grid-template-columns: 1fr; padding: 18px; gap: 14px; }
      .menu-hero { border-right: none; border-bottom: 1px solid rgba(245, 197, 66, 0.22); padding-right: 0; padding-bottom: 12px; }
      .captured-tray { display: none; }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- ETHIOPIAN ROYAL FAMILY MAIN MENU -->
  <div id="main-menu">
    <div class="menu-card">
      <div class="menu-hero">
        <div class="royal-tag">👑 Ethiopian Royal Family Edition</div>
        <div class="nigus-geez">ንጉስ</div>
        <div class="nigus-eng">NIGUS CHESS</div>
        <p class="nigus-desc">
          Playable 3D Ethiopian Wizard's Chess. Command the Aksumite Ivory &amp; Gold Dynasty against the Volcanic Obsidian Empire.
        </p>

        <!-- Yona Graphics Brand Signature with Uploaded Logo -->
        <div class="yona-card">
          <div class="yona-logo">
            <svg viewBox="0 0 100 100" width="32" height="32" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M 65 28 A 23 23 0 1 0 38 56 C 48 59 56 64 58 68" stroke="#FFFFFF" stroke-width="5.2" stroke-linecap="round" fill="none"/>
              <path d="M 35 37 A 14 14 0 0 0 64 41" stroke="#FFFFFF" stroke-width="4.8" stroke-linecap="round" fill="none"/>
              <polygon points="60,21 78,26 67,31 69,39" stroke="#FFFFFF" stroke-width="4.2" stroke-linejoin="round" fill="#000000"/>
              <path d="M 37 56 L 37 64 L 34 69 L 46 93 L 58 69 L 53 63" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              <line x1="46" y1="67" x2="46" y2="91" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="yona-info">
            <span class="yona-sub">Developed By</span>
            <span class="yona-title">YONA GRAPHICS</span>
          </div>
        </div>
      </div>

      <div class="menu-controls">
        <button class="m-btn gold" id="menu-start-ai">
          <span>⚔️ New Game (vs Royal AI)</span>
          <span>▶</span>
        </button>
        <button class="m-btn" id="menu-start-2p">
          <span>👥 2-Player Royal Duel</span>
          <span>▶</span>
        </button>
        <div class="m-grid">
          <button class="m-btn" id="menu-ai-rank">
            <span>🧠 AI:</span>
            <span id="menu-rank-label" style="color:var(--md-primary)">Ras (Med)</span>
          </button>
          <button class="m-btn" id="menu-sound-btn">
            <span>🔊 Sound:</span>
            <span id="menu-sound-label" style="color:var(--md-primary)">ON</span>
          </button>
        </div>
        <button class="m-btn" id="menu-resume-btn" style="display:none; border-color:rgba(255,255,255,0.28);">
          <span>🛡️ Resume Active Battle</span>
          <span>↵</span>
        </button>
      </div>
    </div>
  </div>

  <div id="status-banner">NIGUS ROYAL COURT</div>

  <!-- SINGLE-LEVEL MATERIAL DESIGN 3 HUD -->
  <div class="hud-layer">
    <header class="top-bar">
      <div class="brand-cluster">
        <button class="md-chip" id="btn-open-menu" style="padding:4px 10px;">☰ Menu</button>
        <span class="brand-title">ንጉስ • NIGUS</span>
      </div>
      <div class="turn-indicator">
        <span class="turn-swatch" id="turn-swatch"></span>
        <span id="turn-text">Marble Dynasty (White)</span>
      </div>
      <div class="captured-tray">
        <div class="cap-group" title="Shattered Obsidian">
          <span class="cap-dot obsidian"></span>
          <span id="cap-black">0</span>
        </div>
        <div class="cap-group" title="Shattered Marble">
          <span class="cap-dot marble"></span>
          <span id="cap-white">0</span>
        </div>
      </div>
    </header>

    <nav class="bottom-bar" aria-label="Game Controls">
      <button class="md-chip" id="btn-new">🔄 New</button>
      <button class="md-chip" id="btn-undo">↩️ Undo</button>
      <div class="divider"></div>
      <button class="md-chip active" id="btn-mode">🤖 vs AI</button>
      <div class="divider"></div>
      <button class="md-chip" id="btn-cam">🎥 Cam: Orbit</button>
      <button class="md-chip active" id="btn-action-cam">⚡ Action Cam</button>
      <button class="md-chip active" id="btn-sfx">🔊</button>
    </nav>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // Try locking landscape orientation on supported mobile devices
    try {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
    } catch (e) {}

    // ============================================================================
    // 1. WEB AUDIO SYNTHESIZER (Chimes, Stone Slides & Shatter Explosions)
    // ============================================================================
    class SoundFX {
      constructor() {
        this.enabled = true;
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      playSelect() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(528, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.14);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
      }
      playMove() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(145, now);
        osc.frequency.exponentialRampToValueAtTime(62, now + 0.22);
        gain.gain.setValueAtTime(0.24, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.24);
      }
      playShatter() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        const bufferSize = this.ctx.sampleRate * 0.45;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.12));
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(950, now);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.48, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.44);

        noise.connect(filter).connect(gain).connect(this.ctx.destination);
        noise.start(now);

        const sub = this.ctx.createOscillator();
        const subGain = this.ctx.createGain();
        sub.type = 'sawtooth';
        sub.frequency.setValueAtTime(120, now);
        sub.frequency.exponentialRampToValueAtTime(28, now + 0.38);
        subGain.gain.setValueAtTime(0.35, now);
        subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        sub.connect(subGain).connect(this.ctx.destination);
        sub.start(now);
        sub.stop(now + 0.4);
      }
    }
    const sfx = new SoundFX();

    // ============================================================================
    // 2. THREE.JS SCENE, RENDERER & STUDIO ROOM-ENVIRONMENT LIGHTING
    // ============================================================================
    const container = document.getElementById('canvas-container');
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0D0B0A);
    scene.fog = new THREE.FogExp2(0x0D0B0A, 0.022);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.2, 100);
    const CAM_VIEWS = {
      orbit: { pos: new THREE.Vector3(0, 10.5, 11.2), look: new THREE.Vector3(0, 0, 0), label: '🎥 Cam: Orbit' },
      top:   { pos: new THREE.Vector3(0, 16.5, 0.01), look: new THREE.Vector3(0, 0, 0), label: '🎥 Cam: Top' },
      side:  { pos: new THREE.Vector3(12.2, 6.2, 0),  look: new THREE.Vector3(0, 0.4, 0), label: '🎥 Cam: Royal' }
    };
    let currentCamKey = 'orbit';
    camera.position.copy(CAM_VIEWS.orbit.pos);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI / 2.12;
    controls.minDistance = 5.5;
    controls.maxDistance = 22;
    controls.target.copy(CAM_VIEWS.orbit.look);

    const keyLight = new THREE.DirectionalLight(0xFFF3D6, 2.2);
    keyLight.position.set(7, 14, 8);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.near = 2;
    keyLight.shadow.camera.far = 30;
    const d = 6.5;
    keyLight.shadow.camera.left = -d;
    keyLight.shadow.camera.right = d;
    keyLight.shadow.camera.top = d;
    keyLight.shadow.camera.bottom = -d;
    keyLight.shadow.bias = -0.0005;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0xFF6D3A, 1.1);
    rimLight.position.set(-9, 7, -8);
    scene.add(rimLight);

    const strikeLight = new THREE.PointLight(0xFF6D00, 0, 8);
    scene.add(strikeLight);

    // ============================================================================
    // 3. PBR MATERIALS: AKSUMITE MARBLE & GOLD VS VOLCANIC OBSIDIAN & EMBER
    // ============================================================================
    const MATS = {
      marble: new THREE.MeshPhysicalMaterial({
        color: 0xFAF3E6,
        roughness: 0.18,
        metalness: 0.04,
        clearcoat: 0.45,
        clearcoatRoughness: 0.15
      }),
      marbleGold: new THREE.MeshStandardMaterial({
        color: 0xF5C542,
        roughness: 0.22,
        metalness: 0.88,
        emissive: 0x4A3500,
        emissiveIntensity: 0.25
      }),
      obsidian: new THREE.MeshPhysicalMaterial({
        color: 0x161418,
        roughness: 0.12,
        metalness: 0.25,
        clearcoat: 0.9,
        clearcoatRoughness: 0.08
      }),
      obsidianEmber: new THREE.MeshStandardMaterial({
        color: 0xFF6D3A,
        roughness: 0.3,
        metalness: 0.5,
        emissive: 0xFF3D00,
        emissiveIntensity: 0.75
      }),
      boardLight: new THREE.MeshStandardMaterial({
        color: 0xE8DEC8,
        roughness: 0.28,
        metalness: 0.08
      }),
      boardDark: new THREE.MeshStandardMaterial({
        color: 0x1E1B1A,
        roughness: 0.22,
        metalness: 0.18
      }),
      boardFrame: new THREE.MeshStandardMaterial({
        color: 0x2A211B,
        roughness: 0.45,
        metalness: 0.3
      }),
      frameGold: new THREE.MeshStandardMaterial({
        color: 0xD4A238,
        roughness: 0.28,
        metalness: 0.85
      })
    };

    // ============================================================================
    // 4. ARCHITECTURAL AKSUMITE 64-SQUARE BOARD
    // ============================================================================
    const boardGroup = new THREE.Group();
    scene.add(boardGroup);

    const squareMeshes = [];
    const squareMap = new Map();

    function squareToWorld(sq) {
      const file = sq.charCodeAt(0) - 97;
      const rank = parseInt(sq[1], 10) - 1;
      const x = (file - 3.5) * 1.1;
      const z = (3.5 - rank) * 1.1;
      return new THREE.Vector3(x, 0, z);
    }

    function buildBoard() {
      const plinth = new THREE.Mesh(new THREE.BoxGeometry(10.0, 0.36, 10.0), MATS.boardFrame);
      plinth.position.y = -0.26;
      plinth.receiveShadow = true;
      boardGroup.add(plinth);

      const trim = new THREE.Mesh(new THREE.BoxGeometry(9.18, 0.38, 9.18), MATS.frameGold);
      trim.position.y = -0.24;
      boardGroup.add(trim);

      const sqGeo = new THREE.BoxGeometry(1.06, 0.14, 1.06);
      const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];

      for (let f = 0; f < 8; f++) {
        for (let r = 0; r < 8; r++) {
          const isLight = (f + r) % 2 !== 0;
          const sqName = `${files[f]}${r + 1}`;
          const mesh = new THREE.Mesh(sqGeo, isLight ? MATS.boardLight.clone() : MATS.boardDark.clone());
          const pos = squareToWorld(sqName);
          mesh.position.set(pos.x, -0.07, pos.z);
          mesh.receiveShadow = true;
          mesh.userData = { square: sqName, isLight, baseColor: mesh.material.color.clone() };
          boardGroup.add(mesh);
          squareMeshes.push(mesh);
          squareMap.set(sqName, mesh);
        }
      }

      const ringGeo = new THREE.RingGeometry(0.28, 0.40, 32);
      ringGeo.rotateX(-Math.PI / 2);
      squareMeshes.forEach(sq => {
        const ringMat = new THREE.MeshBasicMaterial({
          color: 0xF5C542,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.0
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.position.set(sq.position.x, 0.012, sq.position.z);
        boardGroup.add(ring);
        sq.userData.ring = ring;
      });
    }
    buildBoard();

    // ============================================================================
    // 5. ORIGINAL WEB CANVAS SCULPTED ETHIOPIAN ROYAL PIECES
    // ============================================================================
    function createLalibelaCross(mat, scale = 1) {
      const cross = new THREE.Group();
      const vBar = new THREE.Mesh(new THREE.BoxGeometry(0.06 * scale, 0.28 * scale, 0.06 * scale), mat);
      const hBar = new THREE.Mesh(new THREE.BoxGeometry(0.22 * scale, 0.06 * scale, 0.06 * scale), mat);
      hBar.position.y = 0.03 * scale;
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.09 * scale, 0.018 * scale, 8, 20), mat);
      ring.position.y = 0.03 * scale;
      cross.add(vBar, hBar, ring);
      return cross;
    }

    function createPedestal(bodyMat, accentMat) {
      const base = new THREE.Group();
      const step1 = new THREE.Mesh(new THREE.CylinderGeometry(0.39, 0.43, 0.09, 24), bodyMat);
      step1.position.y = 0.045;
      step1.castShadow = true;
      step1.receiveShadow = true;

      const runeRing = new THREE.Mesh(new THREE.TorusGeometry(0.36, 0.024, 10, 28), accentMat);
      runeRing.rotation.x = Math.PI / 2;
      runeRing.position.y = 0.095;

      const step2 = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.36, 0.08, 24), bodyMat);
      step2.position.y = 0.13;
      step2.castShadow = true;

      base.add(step1, runeRing, step2);
      return { base, runeRing };
    }

      const isWhite = color === 'w';

      const accentMat = (isWhite ? MATS.marbleGold : MATS.obsidianEmber).clone();

      const bodyGroup = new THREE.Group();
      root.add(bodyGroup);

          torso.position.y = 0.38;

          head.position.y = 0.70;
          head.castShadow = true;

          headband.rotation.x = Math.PI / 2;
          headband.position.y = 0.72;

          const shield = new THREE.Mesh(new THREE.ConeGeometry(0.19, 0.09, 20), accentMat);

          spear.position.set(isWhite ? 0.21 : -0.21, 0.52, 0);
          shieldGroup.add(shield, spear);
          floatPart = shieldGroup;

          plinth.position.y = 0.29;
          plinth.castShadow = true;

          const dir = isWhite ? -1 : 1;
          const neck = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.52, 0.30), bodyMat);
          neck.position.set(0, 0.62, dir * 0.04);
          neck.rotation.x = dir * 0.28;
          neck.castShadow = true;

          const snout = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.34, 16), bodyMat);

            new THREE.Vector2(0.22, 0.52),
            new THREE.Vector2(0.15, 0.78),

          ];
          const robe = new THREE.Mesh(new THREE.LatheGeometry(pts, 24), bodyMat);
          robe.castShadow = true;

            new THREE.Vector2(0.24, 0.56),

            new THREE.Vector2(0.0, 1.16)
          ];
          const gown = new THREE.Mesh(new THREE.LatheGeometry(pts, 28), bodyMat);
          gown.castShadow = true;

          const necklace = new THREE.Mesh(new THREE.TorusGeometry(0.19, 0.028, 10, 28), accentMat);
          necklace.rotation.x = Math.PI / 2;
          necklace.position.y = 0.90;

          const tiaraGroup = new THREE.Group();
          const halo = new THREE.Mesh(new THREE.TorusGeometry(0.18, 0.026, 12, 28), accentMat);
          halo.position.y = 1.32;
          const sunGem = new THREE.Mesh(new THREE.OctahedronGeometry(0.08, 0), accentMat);
          sunGem.position.y = 1.32;
          tiaraGroup.add(halo, sunGem);
          floatPart = tiaraGroup;

          bodyGroup.add(gown, necklace, tiaraGroup);
          break;
        }
        case 'k': {
          // Niguse Negest (Emperor of Ethiopia with Tiered Imperial Crown)
          const pts = [
            new THREE.Vector2(0.0, 0.16),
            new THREE.Vector2(0.34, 0.16),
            new THREE.Vector2(0.27, 0.62),
            new THREE.Vector2(0.20, 0.96),
            new THREE.Vector2(0.26, 1.15),
            new THREE.Vector2(0.0, 1.22)
          ];
          const robe = new THREE.Mesh(new THREE.LatheGeometry(pts, 28), bodyMat);
          robe.castShadow = true;

          const crownGroup = new THREE.Group();
          const tier1 = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.19, 0.14, 12), accentMat);
          tier1.position.y = 1.24;
          const tier2 = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.15, 0.12, 12), accentMat);
          tier2.position.y = 1.36;
          const cross = createLalibelaCross(accentMat, 1.05);
          cross.position.y = 1.56;
          crownGroup.add(tier1, tier2, cross);
          floatPart = crownGroup;

          bodyGroup.add(robe, crownGroup);
          break;

      }

      root.userData = {
        type,
        color,
        bodyGroup,

        runeRing,

    // ============================================================================
    // 6. SHATTER PARTICLE ENGINE
    // ============================================================================
    const activeShards = [];
    const shardGeo = new THREE.DodecahedronGeometry(0.085, 0);

    function triggerShatter(worldPos, victimColor) {
      sfx.playShatter();
      const isWhite = victimColor === 'w';
      const primaryMat = isWhite ? MATS.marble : MATS.obsidian;
      const glowMat = isWhite ? MATS.marbleGold : MATS.obsidianEmber;

      strikeLight.color.setHex(isWhite ? 0xF5C542 : 0xFF4500);
      strikeLight.position.set(worldPos.x, 0.9, worldPos.z);
      strikeLight.intensity = 10;

      for (let i = 0; i < 34; i++) {
        const mat = (i % 3 === 0 ? glowMat : primaryMat).clone();
        mat.transparent = true;
        const shard = new THREE.Mesh(shardGeo, mat);
        const s = 0.55 + Math.random() * 1.15;
        shard.scale.set(s, s * (0.6 + Math.random() * 0.8), s);
        shard.position.set(
          worldPos.x + (Math.random() - 0.5) * 0.35,
          0.25 + Math.random() * 0.75,
          worldPos.z + (Math.random() - 0.5) * 0.35
        );
        shard.castShadow = true;
        scene.add(shard);

        const angle = Math.random() * Math.PI * 2;
        const speed = 1.4 + Math.random() * 3.2;
        activeShards.push({
          mesh: shard,
          vx: Math.cos(angle) * speed,
          vy: 2.2 + Math.random() * 3.4,
          vz: Math.sin(angle) * speed,
          rx: (Math.random() - 0.5) * 12,
          ry: (Math.random() - 0.5) * 12,
          rz: (Math.random() - 0.5) * 12,
          age: 0,
          life: 1.35 + Math.random() * 0.5
        });
      }
    }

    // ============================================================================
    // 7. GAME STATE, WIZARD'S CHESS CHOREOGRAPHY & ROYAL AI
    // ============================================================================
    const chess = new Chess();
    const pieceMeshes = new Map();
    let selectedSquare = null;
    let validMoves = [];
    let isAnimating = false;
    let vsAI = true;
    let aiDifficulty = 1; // 0: Dejazmach (Easy), 1: Ras (Med), 2: Nigus (Hard)
    let actionCamEnabled = true;
    let capturedCounts = { w: 0, b: 0 };
    let activeAction = null;

    function syncBoardFromFEN() {
      pieceMeshes.forEach(mesh => scene.remove(mesh));
      pieceMeshes.clear();

      const board = chess.board();
      const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
      for (let r = 0; r < 8; r++) {
        for (let f = 0; f < 8; f++) {
          const cell = board[r][f];
          if (cell) {
            const sq = `${files[f]}${8 - r}`;
            const mesh = createEthiopianPieceMesh(cell.type, cell.color);
            const pos = squareToWorld(sq);
            mesh.position.copy(pos);
            mesh.userData.square = sq;
            scene.add(mesh);
            pieceMeshes.set(sq, mesh);
          }
        }
      }
      recalculateCaptured();
      updateHUD();
    }

    function recalculateCaptured() {
      const startCounts = { p: 8, r: 2, n: 2, b: 2, q: 1, k: 1 };
      const current = { w: { p:0,r:0,n:0,b:0,q:0,k:0 }, b: { p:0,r:0,n:0,b:0,q:0,k:0 } };
      const board = chess.board();
      for (let r = 0; r < 8; r++) {
        for (let f = 0; f < 8; f++) {
          const c = board[r][f];
          if (c) current[c.color][c.type]++;
        }
      }
      let lostW = 0, lostB = 0;
      Object.keys(startCounts).forEach(t => {
        lostW += Math.max(0, startCounts[t] - current.w[t]);
        lostB += Math.max(0, startCounts[t] - current.b[t]);
      });
      capturedCounts.w = lostW;
      capturedCounts.b = lostB;
      document.getElementById('cap-black').textContent = lostB;
      document.getElementById('cap-white').textContent = lostW;
    }

    function clearHighlights() {
      squareMeshes.forEach(sq => {
        sq.material.color.copy(sq.userData.baseColor);
        sq.material.emissive.setHex(0x000000);
        sq.userData.ring.material.opacity = 0;
      });
    }

    function highlightSelection(sqName) {
      clearHighlights();
      const sqMesh = squareMap.get(sqName);
      if (sqMesh) {
        sqMesh.material.emissive.setHex(0x5A4408);
        sqMesh.userData.ring.material.color.setHex(0xF5C542);
        sqMesh.userData.ring.material.opacity = 0.95;
      }

      validMoves.forEach(m => {
        const targetSq = squareMap.get(m.to);
        if (!targetSq) return;
        const isCapture = m.captured || m.flags.includes('e');
        targetSq.userData.ring.material.color.setHex(isCapture ? 0xFF4500 : 0xF5C542);
        targetSq.userData.ring.material.opacity = 0.85;
        if (isCapture) targetSq.material.emissive.setHex(0x4A1205);
      });
    }

    function showBanner(text, duration = 2200) {
      const banner = document.getElementById('status-banner');
      banner.textContent = text;
      banner.classList.add('visible');
      clearTimeout(banner._timer);
      if (duration > 0) {
        banner._timer = setTimeout(() => banner.classList.remove('visible'), duration);
      }
    }

    function updateHUD() {
      const turn = chess.turn();
      const swatch = document.getElementById('turn-swatch');
      const turnText = document.getElementById('turn-text');

      if (turn === 'w') {
        swatch.classList.remove('black');
        turnText.textContent = 'Marble Dynasty (ንጉስ)';
      } else {
        swatch.classList.add('black');
        turnText.textContent = vsAI ? 'Obsidian AI Thinking...' : 'Obsidian Empire (እሳት)';
      }

      if (chess.in_checkmate()) {
        const winner = turn === 'w' ? 'Obsidian Empire' : 'Marble Dynasty';
        showBanner(`👑 CHECKMATE • ${winner} Reigns Supreme!`, 6000);
      } else if (chess.in_draw() || chess.in_stalemate()) {
        showBanner('ROYAL TRUCE • Match Drawn', 5000);
      } else if (chess.in_check()) {
        showBanner('⚔️ NIGUS IN CHECK!', 2400);
      }
    }

    function executeMoveAnimated(moveObj) {
      isAnimating = true;
      clearHighlights();

      const attackerMesh = pieceMeshes.get(moveObj.from);
      let victimSquare = moveObj.to;
      if (moveObj.flags.includes('e')) {
        const file = moveObj.to[0];
        const rank = moveObj.color === 'w' ? '5' : '4';
        victimSquare = `${file}${rank}`;
      }
      const victimMesh = pieceMeshes.get(victimSquare);
      const isCapture = Boolean(victimMesh);

      const startPos = squareToWorld(moveObj.from);
      const targetPos = squareToWorld(moveObj.to);

      let savedCamPos = null;
      let savedCamTarget = null;
      if (isCapture && actionCamEnabled) {
        savedCamPos = camera.position.clone();
        savedCamTarget = controls.target.clone();
      }

      if (!isCapture) sfx.playMove();

      activeAction = {
        type: isCapture ? 'attack' : 'move',
        moveObj,
        attackerMesh,
        victimMesh,
        victimSquare,
        startPos,
        targetPos,
        savedCamPos,
        savedCamTarget,
        shattered: false,
        elapsed: 0,
        duration: isCapture ? 1.05 : 0.46
      };
    }

    function finalizeAnimatedMove(action) {
      const { moveObj, attackerMesh, victimMesh, victimSquare, targetPos, savedCamPos, savedCamTarget } = action;

      if (victimMesh) {
        scene.remove(victimMesh);
        pieceMeshes.delete(victimSquare);
      }

      pieceMeshes.delete(moveObj.from);

      if (moveObj.flags.includes('p')) {
        scene.remove(attackerMesh);
        const promotedMesh = createEthiopianPieceMesh(moveObj.promotion || 'q', moveObj.color);
        promotedMesh.position.copy(targetPos);
        promotedMesh.userData.square = moveObj.to;
        scene.add(promotedMesh);
        pieceMeshes.set(moveObj.to, promotedMesh);
      } else {
        attackerMesh.position.copy(targetPos);
        attackerMesh.rotation.set(0, 0, 0);
        attackerMesh.userData.square = moveObj.to;
        pieceMeshes.set(moveObj.to, attackerMesh);
      }

      if (moveObj.flags.includes('k') || moveObj.flags.includes('q')) {
        const rank = moveObj.color === 'w' ? '1' : '8';
        const rookFrom = moveObj.flags.includes('k') ? `h${rank}` : `a${rank}`;
        const rookTo = moveObj.flags.includes('k') ? `f${rank}` : `d${rank}`;
        const rookMesh = pieceMeshes.get(rookFrom);
        if (rookMesh) {
          pieceMeshes.delete(rookFrom);
          rookMesh.position.copy(squareToWorld(rookTo));
          rookMesh.userData.square = rookTo;
          pieceMeshes.set(rookTo, rookMesh);
        }
      }

      if (savedCamPos && savedCamTarget) {
        camera.position.copy(savedCamPos);
        controls.target.copy(savedCamTarget);
      }

      isAnimating = false;
      activeAction = null;
      recalculateCaptured();
      updateHUD();

      if (vsAI && !chess.game_over() && chess.turn() === 'b') {
        setTimeout(triggerAIMove, 260);
      }
    }

    const PIECE_VALUES = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };

    function evaluateBoard() {
      let score = 0;
      const board = chess.board();
      for (let r = 0; r < 8; r++) {
        for (let f = 0; f < 8; f++) {
          const piece = board[r][f];
          if (!piece) continue;
          const centerBonus = (3.5 - Math.abs(3.5 - f)) * 6 + (3.5 - Math.abs(3.5 - r)) * 6;
          const val = PIECE_VALUES[piece.type] + centerBonus;
          score += piece.color === 'b' ? val : -val;
        }
      }
      return score;
    }

    function triggerAIMove() {
      if (chess.game_over() || chess.turn() !== 'b') return;
      const moves = chess.moves({ verbose: true });
      if (moves.length === 0) return;

      let bestMove = moves[0];
      let bestScore = -Infinity;
      const noiseScale = aiDifficulty === 0 ? 180 : aiDifficulty === 1 ? 35 : 4;

      for (const m of moves) {
        chess.move(m);
        let score = evaluateBoard() + (Math.random() * noiseScale);
        if (m.captured) score += PIECE_VALUES[m.captured] * 0.35;
        if (chess.in_check()) score += 45;

        if (aiDifficulty >= 1) {
          const replies = chess.moves({ verbose: true });
          let maxReplyCapture = 0;
          for (const rep of replies) {
            if (rep.captured) maxReplyCapture = Math.max(maxReplyCapture, PIECE_VALUES[rep.captured]);
          }
          score -= maxReplyCapture * 0.75;
        }
        chess.undo();

        if (score > bestScore) {
          bestScore = score;
          bestMove = m;
        }
      }

      const executed = chess.move(bestMove);
      if (executed) executeMoveAnimated(executed);
    }

    // ============================================================================
    // 8. RAYCASTING & MENU CONTROLS
    // ============================================================================
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let pointerDownPos = { x: 0, y: 0 };

    renderer.domElement.addEventListener('pointerdown', e => {
      pointerDownPos.x = e.clientX;
      pointerDownPos.y = e.clientY;
    });

    renderer.domElement.addEventListener('pointerup', e => {
      const dx = e.clientX - pointerDownPos.x;
      const dy = e.clientY - pointerDownPos.y;
      if (Math.hypot(dx, dy) > 9) return;
      handleBoardTap(e);
    });

    function handleBoardTap(e) {
      if (!document.getElementById('main-menu').classList.contains('hidden')) return;
      if (isAnimating || chess.game_over()) return;
      if (vsAI && chess.turn() === 'b') return;

      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);

      const pieceObjects = Array.from(pieceMeshes.values());
      const hits = raycaster.intersectObjects([...squareMeshes, ...pieceObjects], true);
      if (hits.length === 0) {
        selectedSquare = null;
        validMoves = [];
        clearHighlights();
        return;
      }

      let hitObj = hits[0].object;
      while (hitObj && !hitObj.userData.square && hitObj.parent) {
        hitObj = hitObj.parent;
      }
      const tappedSq = hitObj?.userData?.square;
      if (!tappedSq) return;

      const moveCandidate = validMoves.find(m => m.to === tappedSq);
      if (selectedSquare && moveCandidate) {
        const moveResult = chess.move({
          from: selectedSquare,
          to: tappedSq,
          promotion: 'q'
        });
        selectedSquare = null;
        validMoves = [];
        if (moveResult) executeMoveAnimated(moveResult);
        return;
      }

      const pieceAtSq = chess.get(tappedSq);
      if (pieceAtSq && pieceAtSq.color === chess.turn()) {
        selectedSquare = tappedSq;
        validMoves = chess.moves({ square: tappedSq, verbose: true });
        sfx.playSelect();
        highlightSelection(tappedSq);
      } else {
        selectedSquare = null;
        validMoves = [];
        clearHighlights();
      }
    }

    // Menu & HUD Button Listeners
    const mainMenu = document.getElementById('main-menu');
    const resumeBtn = document.getElementById('menu-resume-btn');

    function startNewMatch(aiMode) {
      vsAI = aiMode;
      const btnMode = document.getElementById('btn-mode');
      btnMode.textContent = vsAI ? '🤖 vs AI' : '👥 2-Player';
      btnMode.classList.toggle('active', vsAI);
      chess.reset();
      selectedSquare = null;
      validMoves = [];
      clearHighlights();
      syncBoardFromFEN();
      camera.position.copy(CAM_VIEWS[currentCamKey].pos);
      controls.target.copy(CAM_VIEWS[currentCamKey].look);
      resumeBtn.style.display = 'flex';
      mainMenu.classList.add('hidden');
      showBanner(vsAI ? '⚔️ NIGUS • Marble vs Obsidian AI' : '⚔️ NIGUS • 2-Player Royal Duel');
    }

    document.getElementById('menu-start-ai').addEventListener('click', () => startNewMatch(true));
    document.getElementById('menu-start-2p').addEventListener('click', () => startNewMatch(false));
    resumeBtn.addEventListener('click', () => {
      camera.position.copy(CAM_VIEWS[currentCamKey].pos);
      controls.target.copy(CAM_VIEWS[currentCamKey].look);
      mainMenu.classList.add('hidden');
    });
    document.getElementById('btn-open-menu').addEventListener('click', () => {
      resumeBtn.style.display = 'flex';
      mainMenu.classList.remove('hidden');
    });

    document.getElementById('menu-ai-rank').addEventListener('click', () => {
      aiDifficulty = (aiDifficulty + 1) % 3;
      const ranks = ['Dejazmach (Easy)', 'Ras (Med)', 'Nigus (Hard)'];
      document.getElementById('menu-rank-label').textContent = ranks[aiDifficulty];
    });

    function toggleAllSound() {
      sfx.enabled = !sfx.enabled;
      document.getElementById('menu-sound-label').textContent = sfx.enabled ? 'ON' : 'OFF';
      const btnSfx = document.getElementById('btn-sfx');
      btnSfx.classList.toggle('active', sfx.enabled);
      btnSfx.textContent = sfx.enabled ? '🔊' : '🔇';
    }
    document.getElementById('menu-sound-btn').addEventListener('click', toggleAllSound);
    document.getElementById('btn-sfx').addEventListener('click', toggleAllSound);

    document.getElementById('btn-new').addEventListener('click', () => {
      if (isAnimating) return;
      chess.reset();
      selectedSquare = null;
      validMoves = [];
      clearHighlights();
      syncBoardFromFEN();
      showBanner('NEW ROYAL MATCH STARTED');
    });

    document.getElementById('btn-undo').addEventListener('click', () => {
      if (isAnimating) return;
      if (vsAI) {
        chess.undo();
        chess.undo();
      } else {
        chess.undo();
      }
      selectedSquare = null;
      validMoves = [];
      clearHighlights();
      syncBoardFromFEN();
      showBanner('MOVE UNDONE');
    });

    document.getElementById('btn-mode').addEventListener('click', e => {
      vsAI = !vsAI;
      e.currentTarget.classList.toggle('active', vsAI);
      e.currentTarget.textContent = vsAI ? '🤖 vs AI' : '👥 2-Player';
      showBanner(vsAI ? 'MODE: VS ETHIOPIAN AI' : 'MODE: 2-PLAYER PASS & PLAY');
      updateHUD();
      if (vsAI && !chess.game_over() && chess.turn() === 'b' && !isAnimating) {
        setTimeout(triggerAIMove, 300);
      }
    });

    document.getElementById('btn-cam').addEventListener('click', e => {
      const keys = Object.keys(CAM_VIEWS);
      const nextIdx = (keys.indexOf(currentCamKey) + 1) % keys.length;
      currentCamKey = keys[nextIdx];
      const view = CAM_VIEWS[currentCamKey];
      camera.position.copy(view.pos);
      controls.target.copy(view.look);
      e.currentTarget.textContent = view.label;
    });

    document.getElementById('btn-action-cam').addEventListener('click', e => {
      actionCamEnabled = !actionCamEnabled;
      e.currentTarget.classList.toggle('active', actionCamEnabled);
      showBanner(actionCamEnabled ? 'ACTION CAM: ENABLED' : 'ACTION CAM: OFF');
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ============================================================================
    // 9. MAIN RENDER & ANIMATION LOOP
    // ============================================================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.getElapsedTime();

      // Slow cinematic royal turntable while Main Menu is open
      if (!mainMenu.classList.contains('hidden')) {
        const angle = elapsed * 0.22;
        camera.position.x = Math.sin(angle) * 11.2;
        camera.position.z = Math.cos(angle) * 11.2;
        camera.position.y = 7.8;
        controls.target.set(0, 0.3, 0);
      }

      const currentTurn = chess.turn();
      pieceMeshes.forEach(mesh => {
        const { floatPart, accentMat, phase, color, square } = mesh.userData;
        const isSelected = square === selectedSquare;
        const isTurnSide = color === currentTurn;

        if (floatPart) {
          floatPart.position.y = Math.sin(elapsed * 2.6 + phase) * 0.032;
          if (mesh.userData.type === 'b' || mesh.userData.type === 'k' || mesh.userData.type === 'q') {
            floatPart.rotation.y = Math.sin(elapsed * 1.4 + phase) * 0.35;
          }
        }

        if (isSelected) {
          accentMat.emissiveIntensity = 1.6 + Math.sin(elapsed * 8) * 0.4;
          mesh.userData.bodyGroup.position.y = 0.16 + Math.sin(elapsed * 6) * 0.03;
        } else {
          mesh.userData.bodyGroup.position.y = THREE.MathUtils.lerp(mesh.userData.bodyGroup.position.y, 0, dt * 10);
          const baseGlow = color === 'w' ? 0.25 : 0.65;
          const pulse = isTurnSide ? Math.sin(elapsed * 3 + phase) * 0.18 : 0;
          accentMat.emissiveIntensity = baseGlow + pulse;
        }
      });

      if (activeAction) {
        activeAction.elapsed += dt;
        const t = Math.min(1, activeAction.elapsed / activeAction.duration);
        const { attackerMesh, victimMesh, startPos, targetPos } = activeAction;

        if (activeAction.type === 'move') {
          const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
          attackerMesh.position.lerpVectors(startPos, targetPos, ease);
          attackerMesh.position.y = Math.sin(t * Math.PI) * 0.55;
        } else if (activeAction.type === 'attack') {
          if (actionCamEnabled) {
            const mid = new THREE.Vector3().lerpVectors(startPos, targetPos, 0.65);
            const camOffset = new THREE.Vector3(3.2, 3.6, 3.2);
            camera.position.lerp(mid.clone().add(camOffset), dt * 5);
            controls.target.lerp(targetPos, dt * 7);
          }

          if (t < 0.45) {
            const p = t / 0.45;
            const stopPos = new THREE.Vector3().lerpVectors(startPos, targetPos, 0.68);
            attackerMesh.position.lerpVectors(startPos, stopPos, p);
            attackerMesh.position.y = Math.sin(p * Math.PI) * 0.25;
          } else if (t < 0.68) {
            const p = (t - 0.45) / 0.23;
            attackerMesh.position.y = p * 0.72;
            attackerMesh.rotation.x = -p * 0.35;
          } else {
            const p = (t - 0.68) / 0.32;
            const strikeStart = new THREE.Vector3().lerpVectors(startPos, targetPos, 0.68);
            attackerMesh.position.lerpVectors(strikeStart, targetPos, Math.min(1, p * 1.4));
            attackerMesh.position.y = Math.max(0, (1 - p * 1.4) * 0.72);
            attackerMesh.rotation.x = (1 - p) * 0.25;

            if (!activeAction.shattered && p >= 0.35) {
              activeAction.shattered = true;
              if (victimMesh) {
                victimMesh.visible = false;
                triggerShatter(targetPos, victimMesh.userData.color);
              }
            }
          }
        }

        if (t >= 1) finalizeAnimatedMove(activeAction);
      }

      if (strikeLight.intensity > 0) {
        strikeLight.intensity = Math.max(0, strikeLight.intensity - dt * 22);
      }

      for (let i = activeShards.length - 1; i >= 0; i--) {
        const s = activeShards[i];
        s.age += dt;
        if (s.age >= s.life) {
          scene.remove(s.mesh);
          s.mesh.material.dispose();
          activeShards.splice(i, 1);
          continue;
        }
        s.vy -= 9.8 * dt;
        s.mesh.position.x += s.vx * dt;
        s.mesh.position.y += s.vy * dt;
        s.mesh.position.z += s.vz * dt;

        if (s.mesh.position.y < 0.05) {
          s.mesh.position.y = 0.05;
          s.vy *= -0.42;
          s.vx *= 0.72;
          s.vz *= 0.72;
        }

        s.mesh.rotation.x += s.rx * dt;
        s.mesh.rotation.y += s.ry * dt;
        s.mesh.rotation.z += s.rz * dt;
        s.mesh.material.opacity = Math.max(0, 1 - Math.pow(s.age / s.life, 2));
      }

      controls.update();
      renderer.render(scene, camera);
    }

    syncBoardFromFEN();
    animate();
  </script>
</body>
</html>
