<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ንጉስ • Nigus Ethiopian Royal Chess</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <style>
    :root {
      --bg: #09070C;
      --surface: rgba(20, 16, 28, 0.88);
      --gold: #D4AF37;
      --gold-bright: #FFE082;
      --gold-deep: #9A7B1C;
      --ember: #FF5722;
      --crimson: #8B1E24;
      --text: #F7F4EB;
      --muted: #B8B0A4;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none;
    }
    #canvas-container { position: fixed; inset: 0; z-index: 1; }

    /* --- ROYAL ETHIOPIAN MAIN MENU OVERLAY --- */
    #main-menu {
      position: fixed; inset: 0; z-index: 50;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at center, rgba(14, 11, 20, 0.55) 0%, rgba(7, 5, 10, 0.92) 100%);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      transition: opacity 0.4s ease, visibility 0.4s ease;
      padding: 16px;
    }
    #main-menu.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .menu-card {
      position: relative;
      width: min(680px, 94vw);
      max-height: 92vh;
      background: linear-gradient(160deg, rgba(28, 22, 38, 0.95) 0%, rgba(12, 9, 18, 0.98) 100%);
      border: 1.5px solid var(--gold);
      border-radius: 24px;
      padding: 20px 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.85), inset 0 0 28px rgba(212, 175, 55, 0.12);
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      gap: 22px;
      align-items: center;
      overflow: hidden;
    }
    /* Ethiopian Tibeb Geometric Gold Corner Borders */
    .menu-card::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 5px;
      background: repeating-linear-gradient(90deg, #1B8A3D 0px, #1B8A3D 24px, #FCD116 24px, #FCD116 48px, #D62828 48px, #D62828 72px, #D4AF37 72px, #D4AF37 96px);
      opacity: 0.9;
    }

    .menu-hero {
      display: flex; flex-direction: column; align-items: flex-start; text-align: left;
      border-right: 1px solid rgba(212, 175, 55, 0.22);
      padding-right: 18px;
    }
    .royal-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 10px; font-weight: 700; letter-spacing: 1.8px; text-transform: uppercase;
      color: var(--gold-bright); background: rgba(212, 175, 55, 0.15);
      border: 1px solid rgba(212, 175, 55, 0.4); border-radius: 999px;
      padding: 4px 11px; margin-bottom: 8px;
    }
    .geez-title {
      font-size: clamp(38px, 6vw, 54px); font-weight: 900; line-height: 1;
      margin: 0;
      background: linear-gradient(180deg, #FFF6D6 0%, #FFD54F 45%, #B8860B 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 14px rgba(212, 175, 55, 0.35));
    }
    .eng-title {
      font-size: clamp(16px, 2.5vw, 21px); font-weight: 800; letter-spacing: 4px;
      color: var(--text); margin: 4px 0 6px 0;
    }
    .menu-sub {
      font-size: 12px; color: var(--muted); line-height: 1.45; margin: 0 0 14px 0;
    }

    /* Yona Graphics Developer Signature Card */
    .yona-brand {
      display: flex; align-items: center; gap: 11px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(212, 175, 55, 0.32);
      border-radius: 14px; padding: 8px 13px; width: 100%;
    }
    .yona-logo-box {
      width: 38px; height: 38px; border-radius: 10px;
      background: #050507; border: 1px solid rgba(255,255,255,0.22);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.2);
    }
    .yona-text { display: flex; flex-direction: column; }
    .yona-dev-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); }
    .yona-dev-name { font-size: 13px; font-weight: 800; color: var(--gold-bright); letter-spacing: 0.4px; }

    /* Menu Controls Right Column */
    .menu-actions { display: flex; flex-direction: column; gap: 9px; }
    .menu-btn {
      appearance: none; width: 100%;
      border: 1px solid rgba(212, 175, 55, 0.35);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text); padding: 11px 16px; border-radius: 14px;
      font-size: 13px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
      transition: all 0.2s ease;
    }
    .menu-btn.primary {
      background: linear-gradient(135deg, #D4AF37 0%, #9A7B1C 100%);
      color: #09070C; border-color: #FFE082;
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.35);
      font-size: 14px;
    }
    .menu-btn:active { transform: scale(0.98); }
    .menu-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    /* --- SINGLE-LEVEL COMPACT LANDSCAPE HUD --- */
    .hud-bar {
      position: fixed; left: 50%; transform: translateX(-50%);
