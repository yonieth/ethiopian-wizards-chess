name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Bundle Offline Three.js & Fix Android WebView Imports
        run: |
          mkdir -p www/lib

          # Find index.html if placed in root folder
          if [ -f "index.html" ] && [ ! -f "www/index.html" ]; then
            cp index.html www/index.html
          fi

          # Download Three.js ES Modules + Classic builds + Chess.js into www/lib/
          curl -sL "https://unpkg.com/three@0.160.0/build/three.module.js" -o www/lib/three.module.js
          curl -sL "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js" -o www/lib/OrbitControls.js
          curl -sL "https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js" -o www/lib/chess.min.js
          curl -sL "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" -o www/lib/three.min.js

          # CRITICAL FIX 1: Inside OrbitControls.js, replace bare 'three' import with './three.module.js'
          node -e '
            const fs = require("fs");
            let oc = fs.readFileSync("www/lib/OrbitControls.js", "utf8");
            oc = oc.replace(/from\s+["'\'']three["'\'']/g, "from \"./three.module.js\"");
            oc = oc.replace(/from\s+["'\'']\.\.\/\.\.\/\.\.\/build\/three\.module\.js["'\'']/g, "from \"./three.module.js\"");
            fs.writeFileSync("www/lib/OrbitControls.js", oc);
          '

          # CRITICAL FIX 2: Rewrite www/index.html imports so Android WebView doesn't need importmap
          node -e '
            const fs = require("fs");
            let html = fs.readFileSync("www/index.html", "utf8");

            // Remove importmap block (not needed when paths are direct)
            html = html.replace(/<script\s+type=["'\'']importmap["'\'']>[\s\S]*?<\/script>/gi, "");

            // Rewrite ES module imports inside index.html directly to ./lib/
            html = html.replace(/from\s+["'\'']three["'\'']/g, "from \"./lib/three.module.js\"");
            html = html.replace(/from\s+["'\'']three\/addons\/controls\/OrbitControls\.js["'\'']/g, "from \"./lib/OrbitControls.js\"");
            html = html.replace(/from\s+["'\'']https:\/\/[^"'\'']*three\.module\.js["'\'']/g, "from \"./lib/three.module.js\"");
            html = html.replace(/from\s+["'\'']https:\/\/[^"'\'']*OrbitControls\.js["'\'']/g, "from \"./lib/OrbitControls.js\"");

            // Rewrite standard <script src="..."> tags if used
            html = html.replace(/https:\/\/cdnjs\.cloudflare\.com\/ajax\/libs\/chess\.js\/[^"'\'']*\/chess\.min\.js/g, "./lib/chess.min.js");
            html = html.replace(/https:\/\/cdnjs\.cloudflare\.com\/ajax\/libs\/three\.js\/[^"'\'']*\/three\.min\.js/g, "./lib/three.min.js");
            html = html.replace(/https:\/\/cdn\.jsdelivr\.net\/npm\/three@[^"'\'']*\/examples\/js\/controls\/OrbitControls\.js/g, "./lib/OrbitControls.js");

            // Strip external Google Fonts links so offline mode never hangs
            html = html.replace(/<link[^>]*fonts\.googleapis\.com[^>]*>/gi, "");
            html = html.replace(/<link[^>]*fonts\.gstatic\.com[^>]*>/gi, "");

            // Inject an on-screen error catcher right after <head> so any mobile error is visible
            const errorOverlay = `<script>
              window.addEventListener("error", function(e) {
                var d = document.createElement("div");
                d.style.cssText = "position:fixed;top:10px;left:10px;right:10px;z-index:99999;background:#300;color:#FFD54F;padding:12px;border:1px solid #FF5722;font-family:monospace;font-size:12px;border-radius:8px;";
                d.textContent = "JS Error: " + e.message + " (line " + e.lineno + ")";
                document.body.appendChild(d);
              });
              window.addEventListener("unhandledrejection", function(e) {
                var d = document.createElement("div");
                d.style.cssText = "position:fixed;top:60px;left:10px;right:10px;z-index:99999;background:#300;color:#FFD54F;padding:12px;border:1px solid #FF5722;font-family:monospace;font-size:12px;border-radius:8px;";
                d.textContent = "Module Error: " + (e.reason && e.reason.message ? e.reason.message : e.reason);
                document.body.appendChild(d);
              });
            <\/script>`;
            html = html.replace(/<head>/i, "<head>" + errorOverlay);

            fs.writeFileSync("www/index.html", html);
          '

      - name: 5. Initialize Capacitor & Build Android Project
        run: |
          echo '{"name":"ethiopian-wizards-chess","version":"1.0.0","private":true}' > package.json
          echo '{"appId":"com.yona.wizardschess","appName":"Negest Chess","webDir":"www","backgroundColor":"#0B090E","android":{"allowMixedContent":true}}' > capacitor.config.json
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets
          npx cap add android
          npx cap sync android

      - name: 6. Generate Custom Ethiopian Crown Icon & Splash Screen
        run: |
          mkdir -p assets
          if [ ! -f "assets/icon.png" ]; then
            echo '<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024"><rect width="1024" height="1024" fill="#0B090E"/><circle cx="512" cy="512" r="380" fill="none" stroke="#D4AF37" stroke-width="18" opacity="0.5"/><path d="M496 190 H528 V240 H578 V272 H528 V330 H496 V272 H446 V240 H496 Z" fill="#FFD54F"/><path d="M312 680 L280 430 L400 510 L512 340 L624 510 L744 430 L712 680 Z" fill="#D4AF37"/><rect x="300" y="705" width="424" height="55" rx="16" fill="#D4AF37"/><circle cx="512" cy="570" r="24" fill="#FF5722"/><circle cx="400" cy="590" r="16" fill="#FF7043"/><circle cx="624" cy="590" r="16" fill="#FF7043"/></svg>' > assets/icon.svg
            sudo apt-get update && sudo apt-get install -y librsvg2-bin imagemagick
            rsvg-convert -w 1024 -h 1024 assets/icon.svg -o assets/icon.png
          fi
          if [ ! -f "assets/splash.png" ]; then
            convert assets/icon.png -gravity center -background "#0B090E" -extent 2732x2732 assets/splash.png
          fi
          cp assets/icon.png assets/icon-only.png
          cp assets/splash.png assets/splash-dark.png
          npx capacitor-assets generate --android --iconBackgroundColor '#0B090E' --iconBackgroundColorDark '#0B090E' --splashBackgroundColor '#0B090E' --splashBackgroundColorDark '#0B090E' || true
          npx cap sync android

      - name: 7. Compile Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: Ethiopian-Wizards-Chess-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
