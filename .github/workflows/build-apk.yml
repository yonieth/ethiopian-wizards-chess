name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v5

      - name: 2. Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 3. Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Locate HTML & Bundle Offline Libraries
        run: |
          mkdir -p www/lib
          
          # Automatically find any .html file in your repo and copy it to www/index.html
          FOUND_HTML=$(find . -maxdepth 3 -iname "*.html" | head -n 1)
          echo "Found HTML file at: $FOUND_HTML"
          
          if [ -n "$FOUND_HTML" ] && [ "$FOUND_HTML" != "./www/index.html" ]; then
            cp "$FOUND_HTML" www/index.html
          fi

          # Verify www/index.html exists
          ls -la www/index.html

          # Download Three.js and Chess.js locally
          curl -sL "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" -o www/lib/three.min.js
          curl -sL "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js" -o www/lib/OrbitControls.js
          curl -sL "https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js" -o www/lib/chess.min.js
          curl -sL "https://unpkg.com/three@0.160.0/build/three.module.js" -o www/lib/three.module.js

          # Safely replace CDN links using Node.js (avoids Linux sed exit code 2!)
          node -e '
            const fs = require("fs");
            let html = fs.readFileSync("www/index.html", "utf8");
            html = html.replace(/https:\/\/[^\s"'\'']*three\.min\.js/g, "./lib/three.min.js");
            html = html.replace(/https:\/\/[^\s"'\'']*OrbitControls\.js/g, "./lib/OrbitControls.js");
            html = html.replace(/https:\/\/[^\s"'\'']*chess\.min\.js/g, "./lib/chess.min.js");
            html = html.replace(/https:\/\/[^\s"'\'']*three\.module\.js/g, "./lib/three.module.js");
            fs.writeFileSync("www/index.html", html);
          '

      - name: 5. Initialize Capacitor & Generate Android Project
        run: |
          echo '{"name":"ethiopian-wizards-chess","version":"1.0.0","private":true}' > package.json
          echo '{"appId":"com.yona.wizardschess","appName":"Negest Chess","webDir":"www"}' > capacitor.config.json
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap add android
          npx cap sync android

      - name: 6. Compile Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 7. Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: Ethiopian-Wizards-Chess-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
