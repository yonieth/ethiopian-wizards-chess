name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Set up Java JDK 21 (Required for modern Android Gradle)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Prepare Web Folder & Offline Libraries
        run: |
          mkdir -p www/lib

          # Find index.html wherever it was uploaded and copy to www/index.html
          if [ -f "index.html" ] && [ ! -f "www/index.html" ]; then
            cp index.html www/index.html
          fi

          # Fallback check: make sure www/index.html exists
          if [ ! -f "www/index.html" ]; then
            echo "ERROR: Could not find www/index.html or index.html in your repository!"
            ls -la
            exit 1
          fi

          # Download Three.js and Chess.js locally for 100% offline play
          curl -sL "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" -o www/lib/three.min.js
          curl -sL "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js" -o www/lib/OrbitControls.js
          curl -sL "https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js" -o www/lib/chess.min.js
          curl -sL "https://unpkg.com/three@0.160.0/build/three.module.js" -o www/lib/three.module.js

          # Point index.html to local libraries if CDN links are present
          sed -i 's|https://cdnjs.cloudflare.com/ajax/libs/three.js/[^"]*/three.min.js|./lib/three.min.js|g' www/index.html
          sed -i 's|https://cdn.jsdelivr.net/npm/three@[^"]*/build/three.min.js|./lib/three.min.js|g' www/index.html
          sed -i 's|https://cdn.jsdelivr.net/npm/three@[^"]*/examples/js/controls/OrbitControls.js|./lib/OrbitControls.js|g' www/index.html
          sed -i 's|https://unpkg.com/three@[^"]*/examples/js/controls/OrbitControls.js|./lib/OrbitControls.js|g' www/index.html
          sed -i 's|https://cdnjs.cloudflare.com/ajax/libs/chess.js/[^"]*/chess.min.js|./lib/chess.min.js|g' www/index.html
          sed -i 's|https://unpkg.com/three@[^"]*/build/three.module.js|./lib/three.module.js|g' www/index.html

      - name: 5. Initialize Capacitor & Build Android Project
        run: |
          # Write clean package.json directly
          cat << 'EOF' > package.json
          {
            "name": "ethiopian-wizards-chess",
            "version": "1.0.0",
            "description": "3D Ethiopian Wizards Chess",
            "private": true
          }
          EOF

          # Write clean capacitor.config.json directly (avoids npx cap init CLI errors)
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.yona.wizardschess",
            "appName": "Negest Chess",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          # Install Capacitor 7 (supports Java 21 + Android SDK 35 out of the box)
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets

          # Generate Android project
          npx cap add android
          npx cap sync android

      - name: 6. Generate Custom Ethiopian Crown Icon & Splash Screen
        run: |
          mkdir -p assets
          if [ ! -f "assets/icon.png" ]; then
            cat << 'EOF' > assets/icon.svg
            <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
              <rect width="1024" height="1024" fill="#0B090E"/>
              <circle cx="512" cy="512" r="380" fill="none" stroke="#D4AF37" stroke-width="18" opacity="0.5"/>
              <path d="M496 190 H528 V240 H578 V272 H528 V330 H496 V272 H446 V240 H496 Z" fill="#FFD54F"/>
              <path d="M312 680 L280 430 L400 510 L512 340 L624 510 L744 430 L712 680 Z" fill="#D4AF37"/>
              <rect x="300" y="705" width="424" height="55" rx="16" fill="#D4AF37"/>
              <circle cx="512" cy="570" r="24" fill="#FF5722"/>
              <circle cx="400" cy="590" r="16" fill="#FF7043"/>
              <circle cx="624" cy="590" r="16" fill="#FF7043"/>
            </svg>
            EOF
            sudo apt-get update && sudo apt-get install -y librsvg2-bin imagemagick
            rsvg-convert -w 1024 -h 1024 assets/icon.svg -o assets/icon.png
          fi

          if [ ! -f "assets/splash.png" ]; then
            convert assets/icon.png -gravity center -background "#0B090E" -extent 2732x2732 assets/splash.png
          fi

          cp assets/icon.png assets/icon-only.png
          cp assets/splash.png assets/splash-dark.png

          npx capacitor-assets generate --android --iconBackgroundColor '#0B090E' --iconBackgroundColorDark '#0B090E' --splashBackgroundColor '#0B090E' --splashBackgroundColorDark '#0B090E' || true
          npx cap sync android

      - name: 7. Compile Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: Ethiopian-Wizards-Chess-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
