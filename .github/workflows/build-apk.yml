name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Bundle Three.js v0.160.0 + RoomEnvironment for Web-Identical 3D Graphics
        run: |
          mkdir -p www/lib

          FOUND_HTML=$(find . -maxdepth 3 -iname "*.html" ! -path "./node_modules/*" ! -path "./android/*" | head -n 1)
          if [ -n "$FOUND_HTML" ] && [ "$FOUND_HTML" != "./www/index.html" ]; then
            cp "$FOUND_HTML" www/index.html
          fi

          # Download exact Three.js v0.160.0 modules + RoomEnvironment + Chess.js
          curl -sL "https://unpkg.com/three@0.160.0/build/three.module.js" -o www/lib/three.module.js
          curl -sL "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js" -o www/lib/OrbitControls.js
          curl -sL "https://unpkg.com/three@0.160.0/examples/jsm/environments/RoomEnvironment.js" -o www/lib/RoomEnvironment.js
          curl -sL "https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js" -o www/lib/chess.min.js

          # Rewrite internal 'three' imports inside OrbitControls.js and RoomEnvironment.js so Android WebView loads them without needing importmap
          node -e '
            const fs = require("fs");
            for (const file of ["www/lib/OrbitControls.js", "www/lib/RoomEnvironment.js"]) {
              let code = fs.readFileSync(file, "utf8");
              code = code.replace(/from\s+["'\'']three["'\'']/g, "from \"./three.module.js\"");
              fs.writeFileSync(file, code);
            }

            let html = fs.readFileSync("www/index.html", "utf8");
            // Remove importmap (direct relative module imports work on 100% of Android WebViews)
            html = html.replace(/<script\s+type=["'\'']importmap["'\'']>[\s\S]*?<\/script>/gi, "");
            // Point ES module imports directly to ./lib/
            html = html.replace(/from\s+["'\'']three["'\'']/g, "from \"./lib/three.module.js\"");
            html = html.replace(/from\s+["'\'']three\/addons\/controls\/OrbitControls\.js["'\'']/g, "from \"./lib/OrbitControls.js\"");
            html = html.replace(/from\s+["'\'']three\/addons\/environments\/RoomEnvironment\.js["'\'']/g, "from \"./lib/RoomEnvironment.js\"");
            html = html.replace(/https:\/\/cdnjs\.cloudflare\.com\/ajax\/libs\/chess\.js\/[^"'\'']*\/chess\.min\.js/g, "./lib/chess.min.js");
            fs.writeFileSync("www/index.html", html);
          '

      - name: 5. Initialize Capacitor (Nigus Name + Landscape Lock)
        run: |
          echo '{"name":"nigus-chess","version":"1.0.0","private":true}' > package.json
          echo '{"appId":"com.yonagraphics.niguschess","appName":"ንጉስ Nigus","webDir":"www"}' > capacitor.config.json
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets
          npx cap add android
          npx cap sync android

          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(manifestPath, "utf8");
            xml = xml.replace(
              /<activity([^>]*?)android:name="\.MainActivity"/,
              "<activity$1android:name=\".MainActivity\" android:screenOrientation=\"sensorLandscape\""
            );
            fs.writeFileSync(manifestPath, xml);
          '

      - name: 6. Generate Custom Nigus Crown App Icon
        run: |
          mkdir -p assets
          if [ ! -f "assets/icon.png" ]; then
            echo '<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024"><rect width="1024" height="1024" fill="#0D0B0A"/><circle cx="512" cy="512" r="410" fill="none" stroke="#F5C542" stroke-width="22" opacity="0.65"/><circle cx="512" cy="512" r="370" fill="none" stroke="#FFF3C4" stroke-width="6" opacity="0.4"/><path d="M496 170 H528 V225 H582 V257 H528 V320 H496 V257 H442 V225 H496 Z" fill="#FFF3C4"/><path d="M292 670 L260 410 L395 495 L512 325 L629 495 L764 410 L732 670 Z" fill="#F5C542"/><rect x="285" y="695" width="454" height="60" rx="18" fill="#FFF3C4"/><circle cx="512" cy="560" r="28" fill="#FF5722"/><circle cx="395" cy="580" r="18" fill="#FF7043"/><circle cx="629" cy="580" r="18" fill="#FF7043"/></svg>' > assets/icon.svg
            sudo apt-get update && sudo apt-get install -y librsvg2-bin
            rsvg-convert -w 1024 -h 1024 assets/icon.svg -o assets/icon.png
          fi
          cp assets/icon.png assets/icon-only.png
          npx capacitor-assets generate --android --iconBackgroundColor '#0D0B0A' --iconBackgroundColorDark '#0D0B0A' || true
          npx cap sync android

      - name: 7. Compile Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Upload Nigus APK
        uses: actions/upload-artifact@v4
        with:
          name: Nigus-Ethiopian-Chess-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
